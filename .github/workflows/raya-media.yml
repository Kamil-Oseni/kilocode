# kilocode_change - new file: build and exercise the real CGO/libopus/SFU path.
name: Raya media conformance

on:
  push:
    branches: [main]
    paths:
      - "services/raya-mf/**"
      - ".github/workflows/raya-media.yml"
  pull_request:
    paths:
      - "services/raya-mf/**"
      - ".github/workflows/raya-media.yml"
  workflow_dispatch:
    inputs:
      resource_seconds:
        description: "Sustained synthetic transport measurement (60s diagnostic or 30-minute run)"
        type: choice
        options: ["60", "1800"]
        default: "60"
      resource_mode:
        description: "Keep one native child alive, or repeatedly replace children"
        type: choice
        options: ["continuous", "churn"]
        default: "continuous"

permissions:
  contents: read

concurrency:
  group: raya-media-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codec-sfu:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Start the isolated test SFU
        run: |
          docker run --detach --name raya-test-sfu --network host \
            livekit/livekit-server:v1.13.7@sha256:6fd3b7088874c4d119160dd688798dfec852bc014786d392caad15f6f63912a3 --dev --bind 127.0.0.1
          curl --fail --silent --show-error --retry 20 --retry-delay 1 \
            --retry-connrefused --max-time 2 http://127.0.0.1:7880/ > /dev/null

      - name: Build the production codec path and run the full Go suite
        run: docker build --target build --tag raya-mf-check services/raya-mf

      - name: Exercise real Opus and SFU transport
        run: |
          set -o pipefail
          mkdir -p evidence
          docker run --rm --network host \
            --env CGO_ENABLED=1 --env GOMAXPROCS=2 \
            --env RAYA_TEST_LIVEKIT_URL=http://127.0.0.1:7880 \
            --env RAYA_TEST_LIVEKIT_KEY=devkey \
            --env RAYA_TEST_LIVEKIT_SECRET=secret \
            --env RAYA_TEST_MEDIA_BINARY=/out/raya-mf \
            raya-mf-check go test -p 1 -count=1 -timeout 5m -v ./internal/room/livekit ./internal/room/process \
            | tee evidence/native-conformance.log
          grep -q 'RAYA_MEDIA_LATENCY' evidence/native-conformance.log
          python3 - <<'PY'
          import json
          with open('evidence/native-conformance.log', encoding='utf-8') as source:
              reports = [json.loads(line.partition('RAYA_MEDIA_LATENCY ')[2])
                         for line in source if 'RAYA_MEDIA_LATENCY ' in line]
          assert len(reports) == 1
          result = reports[0]
          assert result['version'] == 1 and result['status'] == 'complete'
          assert result['progress'] == {'attemptedSessions': 10, 'completedSessions': 10,
                                       'attemptedTrials': 50, 'confirmedExactNonces': 50}
          assert all(value >= 0 for samples in result['samples'].values() for value in samples)
          PY

      - name: Measure sustained production-child resources
        env:
          DURATION: ${{ inputs.resource_seconds || '60' }}
          MODE: ${{ inputs.resource_mode || 'churn' }}
        run: |
          set -o pipefail
          test "$DURATION" = 60 || test "$DURATION" = 1800
          test "$MODE" = continuous || test "$MODE" = churn
          mkdir -p evidence
          docker image inspect --format '{{.Id}}' raya-mf-check > evidence/build-image.txt
          docker run --rm --network host --memory 2g --pids-limit 256 \
            --mount type=bind,source="$PWD/evidence",target=/evidence \
            --env CGO_ENABLED=1 --env GOMAXPROCS=2 \
            --env RAYA_TEST_LIVEKIT_URL=http://127.0.0.1:7880 \
            --env RAYA_TEST_LIVEKIT_KEY=devkey \
            --env RAYA_TEST_LIVEKIT_SECRET=secret \
            --env RAYA_TEST_MEDIA_BINARY=/out/raya-mf \
            --env RAYA_TEST_RESOURCE_SECONDS="$DURATION" \
            --env RAYA_TEST_RESOURCE_MODE="$MODE" \
            --env RAYA_TEST_RESOURCE_REPORT=/evidence/resources.json \
            raya-mf-check go test -p 1 -count=1 -timeout 35m -v \
              -run '^TestProductionWorkerSustainedResources$' ./internal/room/process \
            | tee evidence/sustained-resources.log
          grep -q 'resource_measurement' evidence/sustained-resources.log
          python3 - "$DURATION" "$MODE" <<'PY'
          import json, math, sys
          with open('evidence/resources.json', encoding='utf-8') as source:
              result = json.load(source)
          with open('evidence/native-conformance.log', encoding='utf-8') as source:
              latency = [json.loads(line.split('RAYA_MEDIA_LATENCY ', 1)[1]) for line in source if 'RAYA_MEDIA_LATENCY {' in line]
          assert len(latency) == 1 and latency[0]['status'] == 'complete'
          assert result['binarySha256'] == latency[0]['binarySHA256']
          assert result['version'] == 1
          assert result['completed'] is True
          assert result['configuredSeconds'] == int(sys.argv[1])
          assert result['elapsedSeconds'] >= int(sys.argv[1])
          assert len(result['rawWindows']) >= int(sys.argv[1]) // 2
          assert result['mode'] == sys.argv[2]
          assert result['cycles'] == 1 if sys.argv[2] == 'continuous' else result['cycles'] >= 2
          assert result['decodedInputFrames'] > 0 and result['receivedOpusPackets'] > 0
          assert result['receivedControl'] > 0
          retired = result['retirements']
          assert len(retired) == result['cycles']
          assert all(child['actualWait'] is True and child['pidAbsent'] is True for child in retired)
          assert all(child['activeSeconds'] > 0 and child['readySeconds'] >= 0 for child in retired)
          assert math.isfinite(result['activeSeconds'])
          assert all(math.isfinite(child['activeSeconds']) for child in retired)
          assert math.isclose(result['activeSeconds'], math.fsum(child['activeSeconds'] for child in retired), rel_tol=1e-12, abs_tol=1e-9)
          identities = {(child['pid'], child['startTicks']) for child in retired}
          assert len(identities) == result['cycles']
          observed = {(child['pid'], child['startTicks']) for window in result['rawWindows'] for child in window['children'] or []}
          assert observed == identities
          windows = result['rawWindows']
          assert all(left['seconds'] <= right['seconds'] for left, right in zip(windows, windows[1:]))
          assert len({(window['parent']['pid'], window['parent']['startTicks']) for window in windows}) == 1
          for window in windows:
              children = window['children'] or []
              assert window['slots'] == len(children)
              assert window['ownedPssKiB'] == window['parent']['pssKiB'] + sum(child['pssKiB'] for child in children)
          assert windows[-1]['phase'] == 'retired' and not windows[-1]['children']
          if sys.argv[2] == 'continuous':
              active = [window for window in result['rawWindows'] if window['phase'] == 'active']
              assert len(active) >= int(sys.argv[1]) // 2
              assert all(len(window['children']) == 1 and window['slots'] == 1 for window in active)
              assert {(child['pid'], child['startTicks']) for window in active for child in window['children']} == identities
              assert retired[0]['seconds'] >= int(sys.argv[1])
              assert retired[0]['activeSeconds'] >= int(sys.argv[1])
          assert all(window['slots'] <= 8 for window in result['rawWindows'])
          assert result['rawWindows'][-1]['slots'] == 0
          for window in result['rawWindows']:
              group = window['cgroup']
              assert group['memory.max'] == str(2 * 1024 ** 3)
              assert group['pids.max'] == '256'
              events = dict(line.split() for line in group['memory.events'].splitlines())
              assert int(events['oom']) == 0 and int(events['oom_kill']) == 0
          PY

      - name: Vet the CGO production sources
        run: docker run --rm --env CGO_ENABLED=1 --env GOMAXPROCS=2 raya-mf-check go vet -p 1 ./...

      - name: Build and smoke-test the production image
        run: |
          docker build --tag raya-mf services/raya-mf
          docker run --detach --name raya-test-media --network host \
            --env RAYA_MF_ADDR=127.0.0.1:7890 \
            --env RAYA_MF_TOKEN=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA raya-mf
          curl --fail --silent --show-error --retry 20 --retry-delay 1 \
            --retry-connrefused --max-time 2 http://127.0.0.1:7890/healthz | \
            python3 -c 'import json,sys; data=json.load(sys.stdin); assert data == {"ok": True, "service": "raya-mf"}'
          status=$(curl --silent --show-error --max-time 2 --output /dev/null \
            --write-out '%{http_code}' http://127.0.0.1:7890/v1/sessions/foreign)
          test "$status" = 401
          docker run --rm --entrypoint sha256sum raya-mf /usr/local/bin/raya-mf
          docker image inspect --format '{{.Id}}' raya-mf

      - name: Retain measurement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raya-media-evidence-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Stop owned test services
        if: always()
        run: |
          docker logs raya-test-sfu || true
          docker logs raya-test-media || true
          docker rm --force raya-test-media raya-test-sfu || true
