<!doctype html>
<!-- raya_change - dev-only visual preview harness shell for isolated webview components -->
<!-- raya_change - production webview root carries this theme attribute; mirror it
     so html[data-theme="kilo-vscode"] rules (Instrument Serif display, transcript
     typography) render faithfully in the harness. -->
<html lang="en" data-theme="kilo-vscode">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Raya preview</title>
    <link rel="stylesheet" href="/.serve/index.css" />
  </head>
  <body>
    <div id="root"></div>
    <script src="/.serve/index.js"></script>
  </body>
</html>
